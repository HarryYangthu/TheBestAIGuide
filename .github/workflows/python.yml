name: Python teaching components
on:
  push:
    paths: ['10-Knowledge/_archive/05-tools-skills-protocols/05-code/shared-schemas/**', '**/*.py', '**/pyproject.toml', 'requirements-dev.lock', 'requirements-components.txt', '**/requirements.txt', 'requirements-learning.txt', '**/*.html', '**/fixtures/**', '.github/workflows/python.yml']
  pull_request:
    paths: ['10-Knowledge/_archive/05-tools-skills-protocols/05-code/shared-schemas/**', '**/*.py', '**/pyproject.toml', 'requirements-dev.lock', 'requirements-components.txt', '**/requirements.txt', 'requirements-learning.txt', '**/*.html', '**/fixtures/**', '.github/workflows/python.yml']
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            requirements-components.txt
            10-Knowledge/02_Harness/*/requirements.txt
            20-Projects/01-rag-lab/requirements.txt
      - run: pip install -r requirements-dev.lock
      - run: pip install -r requirements-components.txt -r 20-Projects/01-rag-lab/requirements.txt
      - run: pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install pypdf==6.1.0 reportlab==4.4.3
      - run: python 10-Knowledge/_archive/05-tools-skills-protocols/05-code/shared-schemas/validate_examples.py
      - run: python scripts/run_python_tests.py
      - run: python scripts/check_component_sources.py
      - run: python scripts/run_python.py 20-Projects/domain-research-agent/evaluation/run_eval.py --output .runs/evaluation
