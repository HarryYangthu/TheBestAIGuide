name: Python teaching components
on:
  push:
    paths: ['**/*.py', '**/pyproject.toml', 'requirements-dev.lock', '**/fixtures/**', '.github/workflows/python.yml']
  pull_request:
    paths: ['**/*.py', '**/pyproject.toml', 'requirements-dev.lock', '**/fixtures/**', '.github/workflows/python.yml']
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: pip install -r requirements-dev.lock
      - run: python scripts/run_python_tests.py
      - run: python scripts/run_python.py 20-Projects/domain-research-agent/evaluation/run_eval.py --output .runs/evaluation
