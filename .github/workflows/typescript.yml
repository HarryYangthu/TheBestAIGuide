name: TypeScript tools and browser
on:
  push:
    paths: ['**/*.ts', '**/package*.json', '**/tsconfig.json', '**/fixtures/**', '.github/workflows/typescript.yml']
  pull_request:
    paths: ['**/*.ts', '**/package*.json', '**/tsconfig.json', '**/fixtures/**', '.github/workflows/typescript.yml']
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        project:
          - 10-Knowledge/05-tools-skills-protocols/05-code/tool-runtime-typescript
          - 10-Knowledge/05-tools-skills-protocols/05-code/mcp-server-typescript
          - 10-Knowledge/13-application-engineering/05-code/browser-agent-typescript
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci
      - if: contains(matrix.project, 'browser-agent')
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test
