<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" role="img" aria-labelledby="title desc">
  <title id="title">上下文工程核心图</title>
  <desc id="desc">在上下文窗口中填充恰到好处的信息，以支持下一步推理，并警惕有毒、分散注意力、混乱、冲突四类上下文状态。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1f2937" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="13" markerHeight="13" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1600" height="1600" fill="#f7f8fb"/>

  <text x="800" y="135" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="62" font-weight="700" fill="#111827">
    Context Engineering
  </text>
  <text x="800" y="198" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="32" fill="#475569">
    在上下文窗口中填充恰到好处的信息，以支持下一步推理
  </text>

  <g filter="url(#shadow)">
    <rect x="95" y="395" width="350" height="420" rx="34" fill="#ffffff" stroke="#dbe3ef" stroke-width="3"/>
    <text x="270" y="475" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="700" fill="#0f172a">
      上下文来源
    </text>
    <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="29" fill="#334155">
      <text x="270" y="575" text-anchor="middle">工具调用</text>
      <text x="270" y="670" text-anchor="middle">文档检索</text>
      <text x="270" y="765" text-anchor="middle">多轮对话</text>
    </g>
  </g>

  <line x1="470" y1="605" x2="590" y2="605" stroke="#475569" stroke-width="7" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="620" y="355" width="360" height="500" rx="38" fill="#eef6ff" stroke="#7db7f0" stroke-width="4"/>
    <text x="800" y="445" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="36" font-weight="700" fill="#0f172a">
      上下文窗口
    </text>
    <rect x="685" y="520" width="230" height="92" rx="24" fill="#ffffff" stroke="#b8d8f6" stroke-width="3"/>
    <text x="800" y="577" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="28" font-weight="700" fill="#075985">
      恰到好处的信息
    </text>
    <text x="800" y="690" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="27" fill="#334155">
      不是越多越好
    </text>
    <text x="800" y="748" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="27" fill="#334155">
      而是支持下一步推理
    </text>
  </g>

  <line x1="1010" y1="605" x2="1130" y2="605" stroke="#475569" stroke-width="7" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="1160" y="430" width="350" height="350" rx="34" fill="#ffffff" stroke="#dbe3ef" stroke-width="3"/>
    <text x="1335" y="535" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="36" font-weight="700" fill="#0f172a">
      下一步推理
    </text>
    <text x="1335" y="620" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="28" fill="#334155">
      基于合适上下文
    </text>
    <text x="1335" y="680" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="28" fill="#334155">
      继续判断与行动
    </text>
  </g>

  <text x="800" y="1000" text-anchor="middle" font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="34" font-weight="700" fill="#334155">
    上下文不断累积后，可能变得：
  </text>

  <g font-family="Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <g filter="url(#shadow)">
      <rect x="80" y="1100" width="335" height="180" rx="30" fill="#fff1f2" stroke="#fda4af" stroke-width="3"/>
      <text x="247" y="1167" text-anchor="middle" font-size="29" font-weight="700" fill="#9f1239">有毒 poisoned</text>
      <text x="247" y="1235" text-anchor="middle" font-size="25" fill="#475569">错误信息反复被引用</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="455" y="1100" width="335" height="180" rx="30" fill="#fff7ed" stroke="#fdba74" stroke-width="3"/>
      <text x="622" y="1167" text-anchor="middle" font-size="28" font-weight="700" fill="#9a3412">分散注意力</text>
      <text x="622" y="1210" text-anchor="middle" font-size="24" font-weight="700" fill="#9a3412">distracting</text>
      <text x="622" y="1255" text-anchor="middle" font-size="25" fill="#475569">过度关注历史</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="830" y="1100" width="335" height="180" rx="30" fill="#fefce8" stroke="#fde68a" stroke-width="3"/>
      <text x="997" y="1167" text-anchor="middle" font-size="29" font-weight="700" fill="#854d0e">混乱 confusing</text>
      <text x="997" y="1235" text-anchor="middle" font-size="25" fill="#475569">无关信息干扰决策</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="1205" y="1100" width="335" height="180" rx="30" fill="#eef2ff" stroke="#a5b4fc" stroke-width="3"/>
      <text x="1372" y="1167" text-anchor="middle" font-size="29" font-weight="700" fill="#3730a3">冲突 clashing</text>
      <text x="1372" y="1235" text-anchor="middle" font-size="25" fill="#475569">内部信息自相矛盾</text>
    </g>
  </g>
</svg>
